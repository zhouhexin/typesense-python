[pytest]
pythonpath = src
asyncio_mode = auto
markers =
    open_ai
    unit: pure-Python unit tests (no I/O, no processes)
    multi_machine: end-to-end tests that need loopback alias IPs (auto-skip if absent)
    deploy: deploy-cluster script command generation
    discovery: node-directory + node-registrar + HTTP endpoints
    http: cross-machine httpx client + retry helpers
    inventory: inventory schema + cluster_config roundtrip
