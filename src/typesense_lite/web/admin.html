<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typesense Lite Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #f9fafc;
        --line: #dce2ea;
        --text: #1d2430;
        --muted: #667085;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --danger: #b42318;
        --shadow: 0 12px 32px rgba(20, 30, 46, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        font-weight: 750;
      }

      h2 {
        font-size: 15px;
        font-weight: 750;
      }

      a {
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 24px 32px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 10px 11px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(15, 118, 110, 0.12);
      }

      .form-grid,
      .cluster-grid {
        display: grid;
        gap: 12px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 750;
        min-height: 38px;
        padding: 0 14px;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
      }

      button.secondary:hover {
        border-color: #b8c2cf;
        background: #eef2f7;
      }

      .message {
        border-radius: 6px;
        background: var(--panel-soft);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 12px;
        padding: 10px 12px;
      }

      .message.error {
        background: #fff1f0;
        color: var(--danger);
      }

      .shard {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-soft);
        padding: 10px;
      }

      .shard-title {
        display: flex;
        justify-content: space-between;
        color: var(--text);
        font-size: 13px;
        font-weight: 750;
      }

      .meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      pre {
        overflow: auto;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        font-size: 12px;
        line-height: 1.5;
        margin: 12px 0 0;
        padding: 12px;
      }

      @media (max-width: 860px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>Typesense Lite Admin</h1>
          <p class="subtitle">Manage the local cluster and seed searchable documents.</p>
        </div>
        <a href="/search">Search</a>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="section-head">
          <h2>Cluster</h2>
          <button class="secondary" id="refresh-cluster" type="button">Refresh</button>
        </div>
        <div id="cluster" class="cluster-grid"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Add Document</h2>
        </div>
        <form id="add-form" class="form-grid">
          <label>
            Collection
            <input name="collection" value="books" autocomplete="off" />
          </label>
          <label>
            Document ID
            <input name="id" value="book-100" autocomplete="off" />
          </label>
          <label>
            Title
            <input name="title" value="Distributed keyword search" autocomplete="off" />
          </label>
          <label>
            Body
            <textarea name="body">This document is stored on a shard and replicated.</textarea>
          </label>
          <label>
            Extra JSON Fields
            <textarea name="extra" placeholder='{"author": "demo"}'></textarea>
          </label>
          <button type="submit">Add Document</button>
        </form>
        <div id="write-message" class="message" hidden></div>
        <pre id="write-output" hidden></pre>
      </section>
    </main>

    <script>
      const clusterEl = document.querySelector("#cluster");
      const writeMessageEl = document.querySelector("#write-message");
      const writeOutputEl = document.querySelector("#write-output");

      document.querySelector("#refresh-cluster").addEventListener("click", loadCluster);
      document.querySelector("#add-form").addEventListener("submit", addDocument);

      loadCluster();

      async function loadCluster() {
        try {
          const response = await fetch('/cluster');
          const cluster = await readJson(response);
          renderCluster(cluster);
        } catch (error) {
          clusterEl.innerHTML = "";
          showMessage(clusterEl, error.message, true);
        }
      }

      async function addDocument(event) {
        event.preventDefault();
        hideMessage(writeMessageEl);
        writeOutputEl.hidden = true;
        writeOutputEl.textContent = "";

        const form = new FormData(event.currentTarget);
        const collection = clean(form.get("collection"));
        const document = {
          id: clean(form.get("id")),
          title: clean(form.get("title")),
          body: clean(form.get("body")),
        };

        const extra = clean(form.get("extra"));
        if (extra) {
          Object.assign(document, JSON.parse(extra));
        }

        try {
          const response = await fetch(`/collections/${encodeURIComponent(collection)}/documents`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(document),
          });
          const payload = await readJson(response);
          showMessage(
            writeMessageEl,
            `Stored ${payload.id} on shard ${payload.shard_id}, primary ${payload.primary}.`
          );
          writeOutputEl.hidden = false;
          writeOutputEl.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          showMessage(writeMessageEl, error.message, true);
        }
      }

      function renderCluster(cluster) {
        const nodes = new Map(cluster.nodes.map((node) => [node.id, node]));
        clusterEl.innerHTML = "";

        Object.entries(cluster.shards).forEach(([shardId, placement]) => {
          const primary = nodes.get(placement.primary);
          const replicas = placement.replicas.join(", ") || "none";
          const shard = document.createElement("div");
          shard.className = "shard";
          shard.innerHTML = `
            <div class="shard-title">
              <span>Shard ${escapeHtml(shardId)}</span>
              <span>${escapeHtml(placement.primary)}</span>
            </div>
            <div class="meta">
              Primary: ${escapeHtml(primary ? `${primary.host}:${primary.port}` : placement.primary)}<br />
              Replicas: ${escapeHtml(replicas)}
            </div>
          `;
          clusterEl.appendChild(shard);
        });
      }

      async function readJson(response) {
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || "Request failed");
        }
        return payload;
      }

      function showMessage(element, message, isError = false) {
        element.hidden = false;
        element.className = isError ? "message error" : "message";
        element.textContent = message;
      }

      function hideMessage(element) {
        element.hidden = true;
        element.textContent = "";
      }

      function clean(value) {
        return String(value || "").trim();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
