<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typesense Lite Search</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dce2ea;
        --text: #1d2430;
        --muted: #667085;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --danger: #b42318;
        --shadow: 0 12px 32px rgba(20, 30, 46, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .header-inner,
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        font-weight: 750;
      }

      h2 {
        font-size: 16px;
        font-weight: 750;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .search-form {
        display: grid;
        gap: 12px;
      }

      .form-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 11px 12px;
      }

      input:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(15, 118, 110, 0.12);
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        min-height: 42px;
        padding: 0 16px;
      }

      button:hover {
        background: var(--accent-dark);
      }

      .message {
        border-radius: 6px;
        background: #f9fafc;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 14px;
        padding: 10px 12px;
      }

      .message.error {
        background: #fff1f0;
        color: var(--danger);
      }

      .results {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .hit {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .hit-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .hit-id {
        font-size: 14px;
        font-weight: 750;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        border-radius: 999px;
        background: #e7f5f3;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 750;
        padding: 4px 8px;
      }

      pre {
        overflow: auto;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
        padding: 12px;
      }

      @media (max-width: 720px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>Typesense Lite Search</h1>
          <p class="subtitle">Search documents across the local distributed cluster.</p>
        </div>
        <nav>
          <a href="/cluster-console">Cluster</a>
          <a href="/admin">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Search Documents</h2>
        <form id="search-form" class="search-form" style="margin-top: 14px">
          <div class="form-row">
            <label>
              Collection
              <input name="collection" value="books" autocomplete="off" />
            </label>
            <label>
              Limit
              <input name="limit" type="number" min="1" max="100" value="10" />
            </label>
          </div>
          <label>
            Query
            <input name="query" value="search" autocomplete="off" />
          </label>
          <button type="submit">Search</button>
        </form>
        <div id="search-message" class="message" hidden></div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script>
      const resultsEl = document.querySelector("#results");
      const searchMessageEl = document.querySelector("#search-message");
      document.querySelector("#search-form").addEventListener("submit", searchDocuments);

      async function searchDocuments(event) {
        event.preventDefault();
        hideMessage(searchMessageEl);
        resultsEl.innerHTML = "";

        const form = new FormData(event.currentTarget);
        const collection = clean(form.get("collection"));
        const query = clean(form.get("query"));
        const limit = clean(form.get("limit")) || "10";
        const params = new URLSearchParams({ q: query, limit });

        try {
          const response = await fetch(
            `/collections/${encodeURIComponent(collection)}/documents/search?${params}`
          );
          const payload = await readJson(response);
          showMessage(searchMessageEl, `${payload.found} result(s) found.`);
          renderResults(payload.hits || []);
        } catch (error) {
          showMessage(searchMessageEl, error.message, true);
        }
      }

      function renderResults(hits) {
        if (!hits.length) {
          resultsEl.innerHTML = `<div class="message">No matching documents.</div>`;
          return;
        }

        resultsEl.innerHTML = "";
        hits.forEach((hit) => {
          const item = document.createElement("article");
          item.className = "hit";
          item.innerHTML = `
            <div class="hit-head">
              <div class="hit-id">${escapeHtml(hit.id)}</div>
              <div class="badges">
                <span class="badge">score ${escapeHtml(hit.score)}</span>
                <span class="badge">shard ${escapeHtml(hit.shard_id)}</span>
                <span class="badge">${escapeHtml(hit.node_id)}</span>
              </div>
            </div>
            <pre>${escapeHtml(JSON.stringify(hit.document, null, 2))}</pre>
          `;
          resultsEl.appendChild(item);
        });
      }

      async function readJson(response) {
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || "Request failed");
        }
        return payload;
      }

      function showMessage(element, message, isError = false) {
        element.hidden = false;
        element.className = isError ? "message error" : "message";
        element.textContent = message;
      }

      function hideMessage(element) {
        element.hidden = true;
        element.textContent = "";
      }

      function clean(value) {
        return String(value || "").trim();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
