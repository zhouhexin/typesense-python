<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typesense Lite Search</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dce2ea;
        --text: #1d2430;
        --muted: #667085;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --danger: #b42318;
        --shadow: 0 12px 32px rgba(20, 30, 46, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .header-inner,
      main {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        font-weight: 750;
      }

      h2 {
        font-size: 16px;
        font-weight: 750;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .panel {
        min-width: 0;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .search-form {
        display: grid;
        gap: 12px;
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      label {
        min-width: 0;
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      input,
      select {
        min-width: 0;
        max-width: 100%;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 11px 12px;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(15, 118, 110, 0.12);
      }

      .advanced-options {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfcfe;
      }

      .advanced-options summary {
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
        font-weight: 750;
        padding: 12px;
      }

      .advanced-content {
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 12px;
      }

      .advanced-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
      }

      .check-row input {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .stat,
      .facet {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfe;
        padding: 12px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stat-value {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 780;
      }

      .facets {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .preset-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .preset-button {
        min-height: 36px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        font-size: 13px;
        padding: 0 12px;
      }

      .preset-button:hover {
        border-color: var(--accent);
        background: #f0fdfa;
        color: var(--accent-dark);
      }

      .facet-title {
        font-size: 13px;
        font-weight: 750;
        margin-bottom: 8px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        min-height: 42px;
        padding: 0 16px;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .message {
        border-radius: 6px;
        background: #f9fafc;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 14px;
        padding: 10px 12px;
      }

      .message.error {
        background: #fff1f0;
        color: var(--danger);
      }

      .results {
        min-width: 0;
        max-width: 100%;
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .hit {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .hit-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 10px;
      }

      .hit-id {
        font-size: 14px;
        font-weight: 750;
      }

      .hit-head > *,
      .badges,
      .hit-id,
      .meta,
      .snippet,
      .badge {
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        border-radius: 999px;
        background: #e7f5f3;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 750;
        padding: 4px 8px;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .snippet {
        border-left: 3px solid var(--accent);
        background: #f7fbfb;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 10px;
        padding: 10px 12px;
      }

      mark {
        background: #d7f5d0;
        color: inherit;
        padding: 0 2px;
      }

      pre {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
        padding: 12px;
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .pagination-controls button {
        min-width: 96px;
      }

      .page-status {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      @media (max-width: 720px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .form-row,
        .advanced-grid,
        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>Typesense Lite Search</h1>
          <p class="subtitle">Search documents across the local distributed cluster.</p>
        </div>
        <nav>
          <a href="/cluster-console">Cluster</a>
          <a href="/admin">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Search Documents</h2>
        <form id="search-form" class="search-form" style="margin-top: 14px">
          <div class="form-row">
            <label>
              Collection
              <select id="collection-select" name="collection">
                <option value="books">books</option>
              </select>
            </label>
            <label>
              Search Keywords
              <input
                name="query"
                placeholder="Enter keywords, e.g. 操作系统"
                autocomplete="off"
                autofocus
              />
            </label>
          </div>
          <details class="advanced-options" id="advanced-options">
            <summary>Advanced Options</summary>
            <div class="advanced-content">
              <div class="advanced-grid">
                <label>
                  Search Scope
                  <select name="query_by">
                    <option value="title,body">Title and body</option>
                    <option value="title">Title only</option>
                    <option value="body">Body only</option>
                  </select>
                </label>
                <label>
                  Field Filter
                  <select name="filter_by">
                    <option value="">No filter</option>
                    <option value="category:tech">Category: tech</option>
                    <option value="category:food">Category: food</option>
                  </select>
                </label>
                <label>
                  Sort
                  <select name="sort_by">
                    <option value="">Relevance</option>
                    <option value="popularity:desc">Popularity: high to low</option>
                    <option value="popularity:asc">Popularity: low to high</option>
                  </select>
                </label>
                <label>
                  Facet
                  <select name="facet_by">
                    <option value="">No facet</option>
                    <option value="category">Category</option>
                  </select>
                </label>
                <label>
                  Highlight
                  <select name="highlight_fields">
                    <option value="title,body">Title and body</option>
                    <option value="title">Title only</option>
                    <option value="body">Body only</option>
                    <option value="">No highlight</option>
                  </select>
                </label>
                <label>
                  Per Page
                  <select name="per_page">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                  </select>
                </label>
                <label>
                  Typos
                  <select name="num_typos">
                    <option value="0">Exact only</option>
                    <option value="1">Allow 1 typo</option>
                    <option value="2">Allow 2 typos</option>
                  </select>
                </label>
                <label class="check-row">
                  <input name="prefix" type="checkbox" />
                  <span>Prefix Search</span>
                </label>
              </div>
              <div>
                <div class="stat-label" style="margin-bottom: 8px">Presets</div>
                <div class="preset-strip" id="preset-strip" role="group" aria-label="Search presets">
                  <button class="preset-button" type="button" data-preset="prefix">Prefix</button>
                  <button class="preset-button" type="button" data-preset="fuzzy">Fuzzy</button>
                  <button class="preset-button" type="button" data-preset="filter">Filter + Facet</button>
                  <button class="preset-button" type="button" data-preset="pagination">Pagination</button>
                </div>
              </div>
            </div>
          </details>
          <button type="submit">Search</button>
        </form>
        <div id="search-message" class="message" hidden></div>
        <div id="summary" class="summary-grid" hidden></div>
        <div id="facets" class="facets" hidden></div>
        <div id="results" class="results"></div>
        <div id="pagination-controls" class="pagination-controls" hidden>
          <button id="previous-page" type="button">Previous</button>
          <span id="page-status" class="page-status"></span>
          <button id="next-page" type="button">Next</button>
        </div>
      </section>
    </main>

    <script>
      const resultsEl = document.querySelector("#results");
      const searchMessageEl = document.querySelector("#search-message");
      const searchFormEl = document.querySelector("#search-form");
      const collectionSelectEl = document.querySelector("#collection-select");
      const advancedOptionsEl = document.querySelector("#advanced-options");
      const summaryEl = document.querySelector("#summary");
      const facetsEl = document.querySelector("#facets");
      const paginationControlsEl = document.querySelector("#pagination-controls");
      const previousPageEl = document.querySelector("#previous-page");
      const nextPageEl = document.querySelector("#next-page");
      const pageStatusEl = document.querySelector("#page-status");
      let currentPage = 1;
      let pageCount = 1;

      searchFormEl.addEventListener("submit", searchDocuments);
      previousPageEl.addEventListener("click", () => changePage(-1));
      nextPageEl.addEventListener("click", () => changePage(1));
      document.querySelectorAll(".preset-button").forEach((button) => {
        button.addEventListener("click", () => applyPreset(button.dataset.preset || ""));
      });
      loadCollections();

      const SEARCH_PRESETS = {
        prefix: {
          query: "dist",
          query_by: "title,body",
          highlight_fields: "title,body",
          filter_by: "",
          sort_by: "",
          facet_by: "",
          per_page: "10",
          num_typos: "0",
          prefix: true,
        },
        fuzzy: {
          query: "distributd serch",
          query_by: "title,body",
          highlight_fields: "title,body",
          filter_by: "",
          sort_by: "",
          facet_by: "",
          per_page: "10",
          num_typos: "1",
          prefix: false,
        },
        filter: {
          query: "search",
          query_by: "title,body",
          highlight_fields: "title,body",
          filter_by: "category:tech",
          sort_by: "popularity:desc",
          facet_by: "category",
          per_page: "10",
          num_typos: "0",
          prefix: false,
        },
        pagination: {
          query: "search",
          query_by: "title,body",
          highlight_fields: "title,body",
          filter_by: "",
          sort_by: "",
          facet_by: "",
          per_page: "10",
          num_typos: "0",
          prefix: false,
        },
      };

      async function searchDocuments(event) {
        event.preventDefault();
        currentPage = 1;
        await runSearch();
      }

      async function runSearch() {
        hideMessage(searchMessageEl);
        resultsEl.innerHTML = "";
        summaryEl.hidden = true;
        facetsEl.hidden = true;
        paginationControlsEl.hidden = true;

        const form = new FormData(searchFormEl);
        const collection = clean(form.get("collection"));
        const query = clean(form.get("query"));
        if (!query) {
          showMessage(searchMessageEl, "Enter keywords in Search Keywords.", true);
          searchFormEl.elements.namedItem("query").focus();
          return;
        }
        const params = new URLSearchParams({ q: query });
        [
          "query_by",
          "filter_by",
          "sort_by",
          "facet_by",
          "highlight_fields",
          "per_page",
          "num_typos",
        ].forEach((key) => appendParam(params, key, form.get(key)));
        params.set("page", String(currentPage));
        params.set("query_by_weights", weightsForScope(clean(form.get("query_by"))));
        if (form.get("prefix") === "on") {
          params.set("prefix", "true");
        }

        try {
          const response = await fetch(
            `/collections/${encodeURIComponent(collection)}/documents/search?${params}`
          );
          const payload = await readJson(response);
          showMessage(searchMessageEl, `${payload.found} result(s) found.`);
          renderSummary(payload);
          renderFacets(payload.facet_counts || []);
          renderResults(payload.hits || []);
          renderPagination(payload);
        } catch (error) {
          showMessage(searchMessageEl, error.message, true);
        }
      }

      async function loadCollections() {
        const selected = collectionSelectEl.value;
        try {
          const response = await fetch('/collections');
          const payload = await readJson(response);
          const collections = payload.collections?.length ? payload.collections : ["books"];
          collectionSelectEl.innerHTML = collections
            .map((collection) => `<option value="${escapeHtml(collection)}">${escapeHtml(collection)}</option>`)
            .join("");
          collectionSelectEl.value = collections.includes(selected) ? selected : collections[0];
        } catch (error) {
          collectionSelectEl.innerHTML = '<option value="books">books</option>';
        }
      }

      function renderSummary(payload) {
        summaryEl.hidden = false;
        summaryEl.innerHTML = [
          ["Found", payload.found || 0],
          ["Page", payload.page || 1],
          ["Per Page", payload.per_page || 0],
        ].map(([label, value]) => `
          <div class="stat">
            <div class="stat-label">${escapeHtml(label)}</div>
            <div class="stat-value">${escapeHtml(value)}</div>
          </div>
        `).join("");
      }

      function renderFacets(facetCounts) {
        if (!facetCounts.length) {
          facetsEl.hidden = true;
          return;
        }
        facetsEl.hidden = false;
        facetsEl.innerHTML = facetCounts.map((facet) => `
          <section class="facet">
            <div class="facet-title">${escapeHtml(facet.field_name)}</div>
            <div class="badges">
              ${(facet.counts || []).map((count) => `
                <span class="badge">${escapeHtml(count.value)} (${escapeHtml(count.count)})</span>
              `).join("")}
            </div>
          </section>
        `).join("");
      }

      function renderPagination(payload) {
        const found = Number(payload.found || 0);
        const perPage = Math.max(Number(payload.per_page || 10), 1);
        currentPage = Math.max(Number(payload.page || 1), 1);
        pageCount = Math.max(Math.ceil(found / perPage), 1);
        paginationControlsEl.hidden = found === 0;
        pageStatusEl.textContent = `Page ${currentPage} of ${pageCount}`;
        previousPageEl.disabled = currentPage <= 1;
        nextPageEl.disabled = currentPage >= pageCount;
      }

      function changePage(offset) {
        const targetPage = Math.min(Math.max(currentPage + offset, 1), pageCount);
        if (targetPage === currentPage) {
          return;
        }
        currentPage = targetPage;
        runSearch();
      }

      function renderResults(hits) {
        if (!hits.length) {
          resultsEl.innerHTML = `<div class="message">No matching documents.</div>`;
          return;
        }

        resultsEl.innerHTML = "";
        hits.forEach((hit) => {
          const documentTitle = hit.document?.title || hit.document?.source || hit.id;
          const sourceName = hit.document?.source || "";
          const item = document.createElement("article");
          item.className = "hit";
          item.innerHTML = `
            <div class="hit-head">
              <div>
                <div class="hit-id">${escapeHtml(documentTitle)}</div>
                <div class="meta">Document ID: ${escapeHtml(hit.id)}</div>
              </div>
              <div class="badges">
                ${sourceName ? `<span class="badge">source ${escapeHtml(sourceName)}</span>` : ""}
                <span class="badge">score ${escapeHtml(hit.score)}</span>
                <span class="badge">shard ${escapeHtml(hit.shard_id)}</span>
                <span class="badge">${escapeHtml(hit.node_id)}</span>
              </div>
            </div>
            <div class="meta">
              text match ${escapeHtml(hit.text_match ?? hit.score)}<br />
              matched terms ${escapeHtml((hit.text_match_info?.matched_terms || []).join(", ") || "-")}
            </div>
            ${hit.highlight ? `<div class="snippet">${hit.highlight}</div>` : ""}
            <pre>${escapeHtml(JSON.stringify(hit.document, null, 2))}</pre>
          `;
          resultsEl.appendChild(item);
        });
      }

      async function readJson(response) {
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || "Request failed");
        }
        return payload;
      }

      function showMessage(element, message, isError = false) {
        element.hidden = false;
        element.className = isError ? "message error" : "message";
        element.textContent = message;
      }

      function hideMessage(element) {
        element.hidden = true;
        element.textContent = "";
      }

      function clean(value) {
        return String(value || "").trim();
      }

      function appendParam(params, key, value) {
        const cleaned = clean(value);
        if (cleaned) {
          params.set(key, cleaned);
        }
      }

      function weightsForScope(scope) {
        return scope === "title,body" ? "3,1" : "1";
      }

      function applyPreset(name) {
        const preset = SEARCH_PRESETS[name];
        if (!preset) {
          return;
        }

        advancedOptionsEl.open = true;
        setFormValues(searchFormEl, preset);
        searchFormEl.requestSubmit();
      }

      function setFormValues(form, values) {
        Object.entries(values).forEach(([key, value]) => {
          const field = form.elements.namedItem(key);
          if (!field) {
            return;
          }

          if (field.type === "checkbox") {
            field.checked = Boolean(value);
            return;
          }

          field.value = String(value);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
